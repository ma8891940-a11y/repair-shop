<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f12" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>جوالك | Gawalak</title>
    <script>
      // تطبيق الوضع المحفوظ قبل ما الصفحة تترسم، عشان ما يحصلش وميض
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('lang');
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
        if (localStorage.getItem('effects') !== '1') document.documentElement.setAttribute('data-lite', '');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
