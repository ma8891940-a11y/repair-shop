<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f12" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>جوالك | Gawalak</title>
    <style>
      /* من أول لحظة قبل ما الكود يحمّل: نفس خلفية البرنامج (tokens.css)، واللوجو ثابت في النص.
         الافتتاحية بتبدأ فوقه بالظبط (نفس المكان والمقاس والشفافية)، فمفيش قفزة ولا شاشة بيضا. */
      html { background: #0b0f12; }
      html[data-theme='light'] { background: #eef3f9; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 85% -10%, rgb(56 214 240 / 0.07), transparent 60%),
          radial-gradient(900px 500px at 0% 110%, rgb(56 214 240 / 0.04), transparent 60%), linear-gradient(180deg, #0b0f12, #0f1418);
        background-attachment: fixed;
        min-height: 100dvh;
      }
      html[data-theme='light'] body {
        background: radial-gradient(1100px 600px at 85% -10%, rgb(120 190 235 / 0.28), transparent 60%),
          radial-gradient(900px 600px at 0% 110%, rgb(160 210 240 / 0.22), transparent 60%), linear-gradient(180deg, #f3f7fc, #e7eef7);
        background-attachment: fixed;
      }
      #boot { position: fixed; inset: 0; z-index: 99; pointer-events: none; overflow: hidden; }
      #boot .calm {
        position: absolute; left: 50%; top: 50%; width: min(560px, 120vw); height: min(560px, 120vw);
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(closest-side, #0b0f12 0%, rgb(11 15 18 / 0.72) 30%, rgb(11 15 18 / 0.3) 62%, transparent 100%);
      }
      html[data-theme='light'] #boot .calm {
        background: radial-gradient(closest-side, #eef3f9 0%, rgb(238 243 249 / 0.72) 30%, rgb(238 243 249 / 0.3) 62%, transparent 100%);
      }
      #boot img { position: absolute; left: 50%; top: 50%; width: 168px; height: 150px; transform: translate(-50%, -50%) scale(0.9); opacity: 0.55; }
      /* حركة "رسم" و"تجميع" بتبدأ من غير لوجو (عشان ما يحصلش قفزة)، و"ظهور بلمعة" بتبدأ من نفس الصورة دي */
      html:not([data-logo-anim='shine']) #boot img { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #boot img, html:not([data-logo-anim='shine']) #boot img { transform: translate(-50%, -50%); opacity: 0.55; } }
    </style>
    <script>
      // تطبيق الوضع المحفوظ قبل ما الصفحة تترسم، عشان ما يحصلش وميض
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('lang');
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
        if (localStorage.getItem('effects') !== '1') document.documentElement.setAttribute('data-lite', '');
        // شكل حركة اللوجو (الافتراضي نفس DEFAULT_LOGO_ANIM في src/app/prefs.tsx)
        var a = localStorage.getItem('logo-anim');
        document.documentElement.setAttribute('data-logo-anim', a === 'shine' || a === 'assemble' || a === 'draw' ? a : 'draw');
      } catch (e) {
        document.documentElement.setAttribute('data-logo-anim', 'draw');
      }
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="calm"></div><img src="%BOOT_LOGO%" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
